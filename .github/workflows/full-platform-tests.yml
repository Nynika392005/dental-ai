name: DentAI Complete Platform Test Suite (5 Core Suites - 1,500 Unique Specs)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  selenium-web-e2e-suite:
    name: 🌐 1. Selenium Web E2E Suite (300 Unique Specs)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run 300 Web Selenium Specs
      run: |
        cd dentai-web/selenium-tests
        npm ci || npm install
        node test-runner.js
    - name: Upload Web Selenium Excel Report
      uses: actions/upload-artifact@v4
      with:
        name: Selenium-Web-300-Report
        path: dentai-web/selenium-tests/test-report.xlsx

  appium-mobile-automation-suite:
    name: 📱 2. Appium Mobile Automation Suite (300 Unique Specs)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run 300 Mobile Appium Specs
      run: |
        cd dentai-mobile/appium-tests
        npm ci || npm install
        node test-runner.js
    - name: Upload Mobile Appium Excel Report
      uses: actions/upload-artifact@v4
      with:
        name: Appium-Mobile-300-Report
        path: dentai-mobile/appium-tests/test-report.xlsx

  unit-test-suite:
    name: ⚡ 3. Unit Test Suite (300 Unique Specs)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run 300 Unit Specs
      run: |
        cd unit-tests
        npm ci || npm install
        node test_runner.js
    - name: Upload Unit Test Excel Report
      uses: actions/upload-artifact@v4
      with:
        name: Unit-Test-300-Report
        path: unit-tests/test-report.xlsx

  load-stress-benchmark-suite:
    name: 🚀 4. High-Concurrency Load & Stress Suite (300 Unique Scenarios)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run 300 High Concurrency Load Scenarios
      run: |
        cd load-tests
        npm ci || npm install
        node load_runner.js
    - name: Upload Load Stress Excel Report
      uses: actions/upload-artifact@v4
      with:
        name: Load-Stress-300-Report
        path: load-tests/load-test-report.xlsx

  api-integration-backend-suite:
    name: 🐍 5. API Integration Suite (300 Unique Specs)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run 300 Backend API Specs
      run: |
        cd dentai-backend/backend-tests
        npm ci || npm install
        node test_runner.js
    - name: Upload API Integration Excel Report
      uses: actions/upload-artifact@v4
      with:
        name: API-Integration-300-Report
        path: dentai-backend/backend-tests/test-report.xlsx
